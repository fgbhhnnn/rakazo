<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,user-scalable=yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; worker-src blob:; connect-src data: blob:; form-action 'none'; base-uri 'none'">
<style>
html,body{margin:0;background:#f2f2f7;color:#111;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#root.docx{background:#fff;padding:20px;overflow-wrap:anywhere}
#root.docx img{max-width:100%;height:auto}
#root.docx table{border-collapse:collapse}#root.docx td,#root.docx th{border:1px solid #ccc;padding:4px 8px}
#root.spreadsheet{padding:12px;overflow-x:auto}
#root.spreadsheet table{border-collapse:collapse;background:#fff;font-size:13px;white-space:nowrap}
#root.spreadsheet th,#root.spreadsheet td{border:1px solid #d0d0d0;padding:4px 8px;text-align:left}
#root.spreadsheet th{background:#e8f0ea;position:sticky;top:0}
h3{margin:16px 0 8px;font-size:15px}.more{color:#666;font-size:13px}
</style>
</head>
<body><div id="root"></div><script type="module">/*VIEWER*/</script></body>
</html>
